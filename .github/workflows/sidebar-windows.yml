name: Sidebar Pro Windows desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sidebar-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'colthreepv/opencode'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build unsigned desktop ZIP
        shell: pwsh
        run: ./.github/sidebar/build-windows.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: sidebar-windows-x64-${{ github.sha }}
          path: dist/sidebar-artifact/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
