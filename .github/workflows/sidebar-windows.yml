name: Sidebar Pro Windows desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sidebar-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'colthreepv/opencode'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build unsigned desktop ZIP
        shell: pwsh
        run: ./.github/sidebar/build-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sidebar-windows-x64-${{ github.sha }}
          path: dist/sidebar-artifact/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
