name: Sidebar upstream compatibility

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Stable v2 tag to probe (forces a check, including the base tag)'
        required: false
        type: string

permissions: {}
concurrency:
  group: sidebar-upstream
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'colthreepv/opencode' && github.ref == 'refs/heads/sidebar-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      run: ${{ steps.discover.outputs.run }}
      tag: ${{ steps.discover.outputs.tag }}
      sha: ${{ steps.discover.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node .github/sidebar/discover.mjs

  check:
    needs: discover
    if: needs.discover.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      report: ${{ steps.check.outputs.report }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve trusted check script and configuration
        run: |
          cp .github/sidebar/check.mjs "$RUNNER_TEMP/sidebar-check.mjs"
          cp .github/sidebar/config.json "$RUNNER_TEMP/sidebar-config.json"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Rebase and test candidate
        id: check
        env:
          TAG: ${{ needs.discover.outputs.tag }}
          FORK_SHA: ${{ needs.discover.outputs.sha }}
          SIDEBAR_CONFIG: ${{ runner.temp }}/sidebar-config.json
        run: node "$RUNNER_TEMP/sidebar-check.mjs"

  report:
    needs: [discover, check]
    if: always() && needs.discover.outputs.run == 'true' && needs.check.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Create or update compatibility issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ needs.check.outputs.report }}
          EXPECTED_TAG: ${{ needs.discover.outputs.tag }}
          EXPECTED_SHA: ${{ needs.discover.outputs.sha }}
        run: node .github/sidebar/report.mjs
